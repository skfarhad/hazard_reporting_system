{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Hazard Reporting System{% endblock %}</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='7' fill='%23d63939'/%3E%3Ccircle cx='8' cy='8' r='3' fill='white'/%3E%3C/svg%3E">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    {% block head_extra %}{% endblock %}
    <link rel="stylesheet" href="{% static 'webui/css/app.css' %}">
    <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body class="bg-body-tertiary">
{% block navbar %}
<nav class="navbar navbar-expand-md bg-white border-bottom">
  <div class="container-fluid">
    <a class="navbar-brand fw-semibold" href="/app/"><i class="bi bi-life-preserver text-danger me-1"></i>Hazard Reporting</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav"
            aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="mainNav">
      <ul class="navbar-nav me-auto">
        <li class="nav-item"><a class="nav-link{% if page == 'dashboard' %} active{% endif %}" href="/app/"><i class="bi bi-map me-1"></i>Dashboard</a></li>
        <li class="nav-item"><a class="nav-link{% if page == 'incidents' %} active{% endif %}" href="/app/incidents/"><i class="bi bi-exclamation-triangle me-1"></i>Incidents</a></li>
        <li class="nav-item"><a class="nav-link{% if page == 'volunteers' %} active{% endif %}" href="/app/volunteers/"><i class="bi bi-people me-1"></i>Volunteers</a></li>
      </ul>
      <span id="currentUser" class="navbar-text small me-3"></span>
      <button id="logoutBtn" class="btn btn-outline-secondary btn-sm" type="button"><i class="bi bi-box-arrow-right me-1"></i>Log out</button>
    </div>
  </div>
</nav>
{% endblock %}

<main class="{% block main_class %}container-fluid py-3{% endblock %}">
{% block content %}{% endblock %}
</main>

<div id="spinner" class="spinner-overlay d-none" role="status" aria-live="polite">
  <div class="spinner-border text-primary"><span class="visually-hidden">Loading…</span></div>
</div>
<div class="toast-container position-fixed bottom-0 end-0 p-3" id="toastContainer"></div>

{% block scripts %}{% endblock %}
</body>
</html>
